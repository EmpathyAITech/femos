<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#3b1a47">
  <meta name="description" content="FEMOS clinician and supervisor console. Review, decide and follow up, in five Indian languages.">
  <title>FEMOS Console</title>
  <link rel="icon" href="/app/icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;600&family=Noto+Sans+Bengali:wght@400;600&family=Noto+Sans+Tamil:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/core/ui/tokens.css">
  <link rel="stylesheet" href="/console/console.css">
</head>
<body>
  <div class="shell">
    <aside class="side">
      <a class="brand" href="/" title="FEMOS website"><img src="/app/icon.svg" alt="" width="30" height="30"><span>FEMOS</span><em>Console</em></a>
      <nav id="nav" aria-label="Sections"></nav>
      <div class="side-foot">
        <label class="small muted" for="who">Signed in as</label>
        <select id="who"></select>
        <div class="sync" id="sync"></div>
        <label class="small muted" for="lang">Language</label><select id="lang"></select>
      </div>
    </aside>
    <main id="main" tabindex="-1"></main>
  </div>
  <div id="tip" role="tooltip" hidden></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="/console/console.js"></script>
</body>
</html>
